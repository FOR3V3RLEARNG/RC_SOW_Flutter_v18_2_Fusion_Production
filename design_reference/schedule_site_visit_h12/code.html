<body class="bg-canvas-l0 text-on-surface antialiased pb-[100px]">
<!-- TopAppBar from JSON -->
<header class="fixed docked full-width top-0 bg-surface dark:bg-surface text-primary dark:text-inverse-primary flat no shadows flex justify-between items-center px-gutter-phone h-16 w-full z-40 border-b border-surface-variant/50">
<button class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:opacity-80 active:scale-95 transition-all duration-150">
<span class="material-symbols-outlined text-primary">home_work</span>
</button>
<div class="text-headline-md font-headline-md font-black text-brand-red dark:text-inverse-primary text-center flex-1">
            RC SOW
        </div>
<button class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:opacity-80 active:scale-95 transition-all duration-150 text-on-surface-variant">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<main class="pt-20 px-gutter-phone max-w-lg mx-auto">
<!-- Page Context Header -->
<div class="mb-lg">
<h1 class="font-hero-title-mobile text-hero-title-mobile text-on-surface mb-base">H12 • Schedule Visit</h1>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                St. Elizabeth • Thornton
            </p>
</div>
<!-- Summary Card -->
<div class="bg-surface-l1 rounded-[16px] shadow-l1 p-md mb-xl flex flex-col gap-sm border border-surface-variant/30">
<div class="flex justify-between items-start">
<div class="font-label-md text-label-md text-on-surface-variant bg-surface-container-low px-2 py-1 rounded">House H12</div>
<div class="bg-surface-container text-primary font-metadata text-metadata px-2 py-1 rounded flex items-center gap-1">
<div class="w-1.5 h-1.5 rounded-full bg-primary"></div>
                    Active Repair
                </div>
</div>
<div class="font-metadata text-metadata text-outline flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">my_location</span>
                18.0674° N, 77.8184° W
            </div>
</div>
<!-- Scheduling Form -->
<form class="flex flex-col gap-lg">
<!-- Type of Visit (Segmented Control) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface">Format</label>
<div class="flex bg-surface-l2 p-1 rounded-full min-h-target-min items-center">
<button class="flex-1 bg-surface-l1 shadow-sm text-primary rounded-full py-2 font-label-md text-label-md text-center transition-all h-full flex items-center justify-center" type="button">
                        Site Visit
                    </button>
<button class="flex-1 text-on-surface-variant rounded-full py-2 font-label-md text-label-md text-center hover:bg-surface-container-low transition-all h-full flex items-center justify-center" type="button">
                        Remote Call
                    </button>
</div>
</div>
<!-- Date -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="visit-date">Date of Visit</label>
<div class="relative">
<input class="w-full bg-surface-l1 border border-outline-variant text-on-surface rounded-[16px] min-h-target-min px-md font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none appearance-none" id="visit-date" type="date">
</div>
</div>
<!-- Participants (Multi-select Chips) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface">Technical Team Participants</label>
<div class="flex flex-wrap gap-2">
<button class="bg-brand-soft border border-primary-fixed-dim text-primary rounded-full px-4 min-h-[40px] font-label-md text-label-md flex items-center gap-1 transition-all" type="button">
<span class="material-symbols-outlined text-[16px]">check</span> Site Supervisor
                    </button>
<button class="bg-surface-l2 border border-outline-variant text-on-surface-variant rounded-full px-4 min-h-[40px] font-label-md text-label-md flex items-center gap-1 hover:bg-surface-container transition-all" type="button">
                        Carpenter
                    </button>
<button class="bg-surface-l2 border border-outline-variant text-on-surface-variant rounded-full px-4 min-h-[40px] font-label-md text-label-md flex items-center gap-1 hover:bg-surface-container transition-all" type="button">
                        Regional Supervisor
                    </button>
<button class="bg-surface-l2 border border-outline-variant text-on-surface-variant rounded-full px-4 min-h-[40px] font-label-md text-label-md flex items-center gap-1 hover:bg-surface-container transition-all" type="button">
                        Construction Spec.
                    </button>
</div>
</div>
<!-- Purpose -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="visit-purpose">Purpose of Visit</label>
<div class="relative">
<select class="w-full bg-surface-l1 border border-outline-variant text-on-surface rounded-[16px] min-h-target-min px-md pr-10 font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all appearance-none outline-none" id="visit-purpose">
<option disabled="" selected="" value="">Select primary purpose</option>
<option value="tech">Technical inspection</option>
<option value="progress">Progress check</option>
<option value="material">Material verification</option>
<option value="issue">Issue resolution</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Priority -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface">Priority</label>
<div class="flex gap-2">
<label class="flex-1">
<input checked="" class="peer sr-only" name="priority" type="radio" value="standard">
<div class="bg-surface-l2 border border-outline-variant text-on-surface-variant rounded-[12px] min-h-target-min flex items-center justify-center font-label-md text-label-md peer-checked:bg-surface-container peer-checked:border-primary peer-checked:text-primary transition-all cursor-pointer">
                            Standard
                        </div>
</label>
<label class="flex-1">
<input class="peer sr-only" name="priority" type="radio" value="urgent">
<div class="bg-surface-l2 border border-outline-variant text-on-surface-variant rounded-[12px] min-h-target-min flex items-center justify-center font-label-md text-label-md peer-checked:bg-warning/20 peer-checked:border-warning peer-checked:text-warning transition-all cursor-pointer">
                            Urgent
                        </div>
</label>
<label class="flex-1">
<input class="peer sr-only" name="priority" type="radio" value="emergency">
<div class="bg-surface-l2 border border-outline-variant text-on-surface-variant rounded-[12px] min-h-target-min flex items-center justify-center font-label-md text-label-md peer-checked:bg-error-container peer-checked:border-error peer-checked:text-error transition-all cursor-pointer">
                            Emergency
                        </div>
</label>
</div>
</div>
<!-- Notes -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="visit-notes">Notes / Comments</label>
<textarea class="w-full bg-surface-l1 border border-outline-variant text-on-surface rounded-[16px] p-md font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none resize-none" id="visit-notes" placeholder="Add specific details or instructions for the team..." rows="3"></textarea>
</div>
<!-- Submit Action -->
<div class="mt-md">
<button class="w-full bg-brand-red text-on-primary min-h-target-min rounded-[16px] font-section-title text-section-title uppercase tracking-wider flex items-center justify-center gap-2 hover:bg-brand-strong transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-[20px]">calendar_add_on</span>
                    Schedule Visit
                </button>
</div><div class="mt-sm flex justify-center">
    <button class="w-full border border-outline-variant text-primary min-h-target-min rounded-[16px] font-label-md text-label-md uppercase tracking-wider flex items-center justify-center gap-2 hover:bg-surface-container transition-colors active:scale-[0.98]" type="button">
        <span class="material-symbols-outlined text-[20px]">history_edu</span>
        View Daily Site Logs
    </button>
</div>
</form>
</main>
<!-- BottomNavBar from JSON -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 pb-safe bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant dark:border-none shadow-lg rounded-t-xl">
<!-- Dashboard (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors rounded-xl" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-label-md font-label-md mt-1">Dashboard</span>
</a>
<!-- Scope (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors rounded-xl" href="#">
<span class="material-symbols-outlined">assignment</span>
<span class="text-label-md font-label-md mt-1">Scope</span>
</a>
<!-- Control (Active) -->

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings_suggest</span>
<span class="text-label-md font-label-md mt-1">Control</span>
</a>
<!-- Houses (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors rounded-xl" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-label-md font-label-md mt-1">Houses</span>
</a>
<!-- More (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors rounded-xl" href="#">
<span class="material-symbols-outlined">more_horiz</span>
<span class="text-label-md font-label-md mt-1">More</span>
</a>
</nav>
