<style>
    body {
      background-color: #000;
      color: #fff;
    }
    .scanner-line {
      width: 100%;
      height: 2px;
      background: #D32F2F;
      position: absolute;
      top: 0;
      left: 0;
      animation: scan 2s infinite linear;
      box-shadow: 0 0 10px #D32F2F;
    }
    @keyframes scan {
      0% { top: 0; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    .corner-tl { top: -2px; left: -2px; border-top: 4px solid #D32F2F; border-left: 4px solid #D32F2F; }
    .corner-tr { top: -2px; right: -2px; border-top: 4px solid #D32F2F; border-right: 4px solid #D32F2F; }
    .corner-bl { bottom: -2px; left: -2px; border-bottom: 4px solid #D32F2F; border-left: 4px solid #D32F2F; }
    .corner-br { bottom: -2px; right: -2px; border-bottom: 4px solid #D32F2F; border-right: 4px solid #D32F2F; }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="h-screen w-screen overflow-hidden flex flex-col relative font-body-md text-body-md">
<!-- Top Navigation (Task-Focused - Minimal) -->
<header class="flex items-center justify-between px-gutter-phone py-sm w-full z-50 absolute top-0 left-0 bg-gradient-to-b from-black/80 to-transparent">
<button aria-label="Close" class="text-white p-xs flex items-center justify-center rounded-full bg-black/40 backdrop-blur-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="text-center text-white">
<h1 class="font-headline-md text-headline-md m-0">AI Scope Import</h1>
<p class="font-metadata text-metadata opacity-80 m-0">Position drawing in frame</p>
</div>
<button aria-label="Flash" class="text-white p-xs flex items-center justify-center rounded-full bg-black/40 backdrop-blur-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">flash_off</span>
</button>
</header>
<!-- Viewfinder Canvas -->
<main class="flex-1 relative w-full h-full bg-gray-900 flex items-center justify-center overflow-hidden">
<!-- Camera Feed Mock (Would be live video in prod) -->
<div class="absolute inset-0 w-full h-full bg-gray-800 opacity-60" data-alt="A slightly blurred, top-down view of a hand-drawn architectural floor plan sketch on grid paper resting on a wooden desk. Ambient office lighting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBWLZAUiYkuiLzO4WdzVctr_TsXMZjhCVfQCqIe1VOnDsJWK7NzGp8BN6GeyUjPmcBY9MU8inotCyt0BqFgzu1Kkd9VeRJqkBVhUz6jVwOoYonan0JDfihUydMmVLuucLmiA8OLvmSUuDSCcYWitPE3FveehyulR35l-dQPY-1jBf-ophZdZae6nWOjiFkE8gDkttSt2HSu11rI_IDI7kJaSIJYdLp93kPJHo6g47KVzmHtz9yiMA77WA')"></div>
<!-- Alignment Overlay -->
<div class="relative w-[85%] aspect-[3/4] border-2 border-white/30 rounded-lg box-border">
<!-- Corners -->
<div class="absolute w-8 h-8 corner-tl"></div>
<div class="absolute w-8 h-8 corner-tr"></div>
<div class="absolute w-8 h-8 corner-bl"></div>
<div class="absolute w-8 h-8 corner-br"></div>
<!-- Scanner Line (Active State) -->
<div class="scanner-line hidden" id="scanner-line"></div>
<!-- Detection Points (Processing State Mock) -->
<div class="hidden" id="processing-overlay">
<div class="absolute top-1/4 left-1/4 w-3 h-3 bg-brand-red rounded-full shadow-[0_0_8px_#D32F2F] animate-pulse"></div>
<div class="absolute top-1/2 right-1/3 w-3 h-3 bg-brand-red rounded-full shadow-[0_0_8px_#D32F2F] animate-pulse" style="animation-delay: 0.2s;"></div>
<div class="absolute bottom-1/3 left-1/2 w-3 h-3 bg-brand-red rounded-full shadow-[0_0_8px_#D32F2F] animate-pulse" style="animation-delay: 0.4s;"></div>
</div>
</div>
<!-- Helpful Hint -->
<div class="absolute top-[20%] left-0 w-full text-center px-lg">
<div class="inline-block bg-black/60 text-white font-metadata text-metadata px-md py-xs rounded-full backdrop-blur-md border border-white/20">
        Ensure edges are visible and well-lit
      </div>
</div>
</main>
<!-- Bottom Actions -->
<footer class="w-full bg-surface/10 backdrop-blur-lg border-t border-white/20 pb-safe z-50 absolute bottom-0 left-0">
<div class="flex items-center justify-between px-gutter-phone py-lg w-full">
<!-- Gallery Upload -->
<button aria-label="Gallery" class="flex flex-col items-center justify-center text-white active:scale-95 transition-transform w-[80px]">
<div class="w-target-min h-target-min rounded-full bg-white/10 flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">photo_library</span>
</div>
<span class="font-metadata text-metadata">Gallery</span>
</button>
<!-- Capture Button -->
<button aria-label="Capture Document" class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center active:scale-90 transition-transform" id="capture-btn">
<div class="w-16 h-16 rounded-full bg-white"></div>
</button>
<!-- Mode Switch (Document vs Photo) -->
<button aria-label="Mode" class="flex flex-col items-center justify-center text-white active:scale-95 transition-transform w-[80px]">
<div class="w-target-min h-target-min rounded-full bg-white/10 flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</div>
<span class="font-metadata text-metadata text-brand-red font-bold">Auto</span>
</button>
</div>
</footer>
<script>
    document.getElementById('capture-btn').addEventListener('click', function() {
      // Simulate processing state
      const scanner = document.getElementById('scanner-line');
      const overlay = document.getElementById('processing-overlay');
      
      scanner.classList.remove('hidden');
      overlay.classList.remove('hidden');
      
      // Reset after 3 seconds
      setTimeout(() => {
        scanner.classList.add('hidden');
        overlay.classList.add('hidden');
        // In a real app, this would transition to a confirmation/editing screen
      }, 3000);
    });
  </script>
