name: rc_sow_flutter
version: 20.4.1+205
description: RC SOW scalable production management system — Fusion v20.4, preserving the spacious v18.2 Design DNA.
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.16.0
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  pdf: 3.12.0
  printing: 5.14.3
  flame: 1.38.2
  excel: 4.0.6
  file_picker: 12.2.0
  image_picker: 1.2.3
  path_provider: 2.1.6
  share_plus: 13.3.0
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/brand/rc_sow_house_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/rc_sow_house_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/rc_sow_house_icon.png

flutter_native_splash:
  color: "#F4F7FB"
  image: assets/brand/rc_sow_house_icon.png
  android_12:
    color: "#F4F7FB"
    image: assets/brand/rc_sow_house_icon.png
