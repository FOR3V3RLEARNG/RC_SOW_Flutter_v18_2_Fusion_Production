name: rc_sow_flutter
version: 20.5.14+221
description: RC SOW production management system — expressive Material 3, field operations, beneficiary agreements and categorized notifications.
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.16.0
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  webview_flutter: 4.14.1
  webview_flutter_web: 0.2.3+4
  pdf: 3.12.0
  printing: 5.14.3
  flame: 1.38.2
  excel: 4.0.6
  file_picker: 12.2.0
  image_picker: 1.2.3
  path_provider: 2.1.6
  share_plus: 13.3.0
  http: 1.6.0
  geolocator: 14.0.3
  flutter_map: 8.3.2
  latlong2: 0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/brand/rc_sow_house_icon.png
    - assets/sounds/construction_alert.wav

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/rc_sow_house_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/rc_sow_house_icon.png
