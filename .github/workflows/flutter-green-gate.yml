name: RC SOW Fusion Auto-Repair + Green Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fusion/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: rc-sow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Auto-repair, verify, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Auto-repair Dart formatting
        if: github.event_name != 'pull_request'
        id: repair_format
        shell: bash
        run: |
          set -euo pipefail

          dart format .
          git diff --check

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting repair required."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Canonical formatting changed tracked source files. Committing repair."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # At this point only the formatter has run. -u stages modifications
          # to tracked files without adding generated Android/build output.
          git add -u
          git commit -m "chore(ci): apply canonical Dart formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Strict formatting verification
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed .
          git diff --check

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Bootstrap Android platform
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create . \
              --platforms=android \
              --org org.jamaicaredcross \
              --project-name rc_sow_flutter \
              --empty
          fi
          chmod +x scripts/patch_android.sh
          ./scripts/patch_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Dependency compatibility graph
        run: flutter pub deps --style=compact

      - name: Verify OAuth callback contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'org.jamaicaredcross.rcsowflutter' lib/core/supabase_config.dart
          grep -q 'oauthRedirectUri' scripts/patch_android.sh
          grep -q 'android:scheme="org.jamaicaredcross.rcsowflutter"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="login-callback"' android/app/src/main/AndroidManifest.xml

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Post-generation formatting verification
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Production contract checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_production_contracts.py

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab

          test -s "$APK"
          test -s "$AAB"
          sha256sum "$APK" "$AAB" | tee release-sha256.txt
          ls -lh "$APK" "$AAB"

      - name: Upload APK, AAB and checksums
        uses: actions/upload-artifact@v6
        with:
          name: rc-sow-v20-4-production-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            release-sha256.txt
          if-no-files-found: error
          retention-days: 14
