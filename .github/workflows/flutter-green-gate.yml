name: RC SOW Flutter v18.2 Green Gate

on:
  workflow_dispatch:
  push:
    branches: [main, 'fusion/**']
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Flutter doctor
        run: flutter doctor -v
      - name: Bootstrap Android platform
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org org.jamaicaredcross --project-name rc_sow_flutter --empty
          fi
          ./scripts/patch_android.sh
      - name: Dependencies
        run: flutter pub get
      - name: Dependency graph
        run: flutter pub deps --style=compact
      - name: Verify OAuth callback contract
        run: |
          grep -q 'org.jamaicaredcross.rcsowflutter' lib/core/supabase_config.dart
          grep -q 'oauthRedirectUri' scripts/patch_android.sh
          grep -q 'android:scheme="org.jamaicaredcross.rcsowflutter"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="login-callback"' android/app/src/main/AndroidManifest.xml
      - name: Launcher icon
        run: dart run flutter_launcher_icons
      - name: Native splash
        run: dart run flutter_native_splash:create
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release AAB
        run: flutter build appbundle --release
      - name: Verify artifacts
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v6
        with:
          name: rc-sow-v18-2-production-apk-aab
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
