name: RC SOW Connected Green Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format source
        run: dart format lib test
      - name: Analyze
        run: flutter analyze

  core-tests:
    name: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run core and navigation tests
        shell: bash
        run: |
          mapfile -t test_files < <(
            find test -maxdepth 1 -name '*_test.dart'               ! -name 'all_interactions_test.dart'               -print | sort
          )
          printf 'Running %s non-interaction test files\n' "${#test_files[@]}"
          flutter test "${test_files[@]}"

  interaction-tests:
    name: interaction-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run interaction shard
        run: >
          flutter test test/all_interactions_test.dart
          --dart-define=INTERACTION_SHARD_INDEX=${{ matrix.shard }}
          --dart-define=INTERACTION_SHARD_COUNT=6

  build-web:
    name: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web --release
      - name: Upload web preview
        uses: actions/upload-artifact@v7
        with:
          name: RC-SOW-v20.0.0-Web-Preview
          path: build/web
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: RC-SOW-v20.0.0-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  verify:
    name: verify
    if: always()
    needs:
      - preflight
      - core-tests
      - interaction-tests
      - build-web
      - build-android
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce Green Gate
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          CORE_TESTS: ${{ needs.core-tests.result }}
          INTERACTION_TESTS: ${{ needs.interaction-tests.result }}
          WEB: ${{ needs.build-web.result }}
          ANDROID: ${{ needs.build-android.result }}
        run: |
          printf 'preflight=%s\n' "$PREFLIGHT"
          printf 'core-tests=%s\n' "$CORE_TESTS"
          printf 'interaction-tests=%s\n' "$INTERACTION_TESTS"
          printf 'build-web=%s\n' "$WEB"
          printf 'build-android=%s\n' "$ANDROID"

          for result in             "$PREFLIGHT"             "$CORE_TESTS"             "$INTERACTION_TESTS"             "$WEB"             "$ANDROID"
          do
            test "$result" = "success"
          done

          echo "RC SOW v20 Green Gate passed."
