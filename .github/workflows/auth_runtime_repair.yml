name: RC SOW v20.1 Auth Repair + Green Build

"on":
  push:
    branches:
      - rc-sow-connected-v20.1.0
    paths:
      - .github/workflows/auth_runtime_repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc-sow-v20-auth-runtime-repair-v3
  cancel-in-progress: false

env:
  RC_BRANCH: rc-sow-connected-v20.1.0

jobs:
  repair:
    name: repair-auth-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rc-sow-connected-v20.1.0
          fetch-depth: 0
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          flutter pub get
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true

      - name: Repair auth runtime
        env:
          REPAIR_B64: ''
        run: |
          printf '%s' "$REPAIR_B64" | base64 --decode > /tmp/rc_sow_auth_repair.py
          python3 /tmp/rc_sow_auth_repair.py

      - name: Format and verify patch
        run: |
          dart format \
            lib/services/production_backend.dart \
            lib/core/app_state.dart \
            lib/screens/auth_screens.dart
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for file in "${changed[@]}"; do
            case "$file" in
              lib/services/production_backend.dart|lib/core/app_state.dart|lib/screens/auth_screens.dart)
                ;;
              *)
                echo "Unexpected repair change: $file"
                exit 1
                ;;
            esac
          done

      - name: Analyze repaired source
        run: flutter analyze

      - name: Targeted auth/navigation tests
        run: |
          flutter test \
            test/app_state_test.dart \
            test/all_routes_render_test.dart \
            test/navigation_journeys_test.dart

      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/services/production_backend.dart \
            lib/core/app_state.dart \
            lib/screens/auth_screens.dart

          if git diff --cached --quiet; then
            echo "Auth source already repaired."
          else
            git commit -m "fix: stop Supabase authentication login loop"
            git fetch origin "$RC_BRANCH"
            if ! git merge-base --is-ancestor "origin/$RC_BRANCH" HEAD; then
              git rebase "origin/$RC_BRANCH"
            fi
            git push origin "HEAD:$RC_BRANCH"
          fi

          echo "Repaired branch head:"
          git rev-parse HEAD

  preflight:
    name: preflight
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rc-sow-connected-v20.1.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze

  core-tests:
    name: core-tests
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rc-sow-connected-v20.1.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run core and navigation tests
        shell: bash
        run: |
          mapfile -t test_files < <(
            find test -maxdepth 1 -name '*_test.dart' ! -name 'all_interactions_test.dart' -print | sort
          )
          printf 'Running %s non-interaction test files\n' "${#test_files[@]}"
          flutter test "${test_files[@]}"

  interaction-tests:
    name: interaction-shard-${{ matrix.shard }}
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rc-sow-connected-v20.1.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run interaction shard
        run: >
          flutter test test/all_interactions_test.dart
          --dart-define=INTERACTION_SHARD_INDEX=${{ matrix.shard }}
          --dart-define=INTERACTION_SHARD_COUNT=6

  build-web:
    name: build-web
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rc-sow-connected-v20.1.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web scaffolding
        run: flutter create --platforms=web --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: RC-SOW-v20.1.0-AuthFixed-Web
          path: build/web
          if-no-files-found: error
          retention-days: 30

  build-android-apk:
    name: build-android-apk
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rc-sow-connected-v20.1.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: flutter create --platforms=android --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: RC-SOW-v20.1.0-AuthFixed-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-android-aab:
    name: build-android-aab
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rc-sow-connected-v20.1.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: flutter create --platforms=android --project-name=rc_sow_connected --org=org.jamaicaredcross .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android AAB
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v7
        with:
          name: RC-SOW-v20.1.0-AuthFixed-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  package-source:
    name: package-fixed-source
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rc-sow-connected-v20.1.0
          fetch-depth: 0
      - name: Package fixed source
        run: |
          git archive \
            --format=zip \
            --output=RC_SOW_v20.1.0_AUTH_FIXED_SOURCE.zip \
            HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: RC-SOW-v20.1.0-AuthFixed-Source
          path: RC_SOW_v20.1.0_AUTH_FIXED_SOURCE.zip
          if-no-files-found: error
          retention-days: 30

  verify:
    name: verify
    if: always()
    needs:
      - repair
      - preflight
      - core-tests
      - interaction-tests
      - build-web
      - build-android-apk
      - build-android-aab
      - package-source
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enforce auth-fixed green gate
        env:
          REPAIR: ${{ needs.repair.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
          CORE: ${{ needs.core-tests.result }}
          INTERACTIONS: ${{ needs.interaction-tests.result }}
          WEB: ${{ needs.build-web.result }}
          APK: ${{ needs.build-android-apk.result }}
          AAB: ${{ needs.build-android-aab.result }}
          SOURCE: ${{ needs.package-source.result }}
        run: |
          for result in \
            "$REPAIR" "$PREFLIGHT" "$CORE" "$INTERACTIONS" \
            "$WEB" "$APK" "$AAB" "$SOURCE"; do
            test "$result" = "success"
          done
          echo "RC SOW v20.1 auth-fixed GitHub gate passed."
